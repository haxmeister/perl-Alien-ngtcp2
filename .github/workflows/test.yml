name: test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.22"
          - "5.24"
          - "5.26"
          - "5.28"
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
          - "5.44"


    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Install fallback build dependencies
        run: cpanm --notest Alien::cmake3 URI

      - name: Install Unix OpenSSL fallback helper
        if: runner.os != 'Windows'
        run: cpanm --notest Alien::OpenSSL

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl Makefile.PL

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'

      - name: Distribution test
        if: matrix.perl == '5.44'
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}, "disttest") == 0 or exit 1'

      - name: Install CPANTS lint
        if: matrix.perl == '5.44'
        run: cpanm --notest App::CPANTS::Lint

      - name: CPANTS lint
        if: matrix.perl == '5.44'
        run: |
          perl -MConfig -e 'system($Config{make}, "dist") == 0 or exit 1'
          cpants_lint.pl --verbose Alien-ngtcp2-*.tar.gz

  macos:
    name: macOS Perl ${{ matrix.perl }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.28"
