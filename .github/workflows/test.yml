        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'


  legacy-strawberry:
    name: Legacy Strawberry TLS diagnostic
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Set up Strawberry Perl 5.28
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.28"
          distribution: strawberry
          install-modules: Alien::Build::MM
          enable-modules-cache: false

      - name: Verify old bundled OpenSSL is rejected clearly
        shell: pwsh
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: |
          perl Makefile.PL *> legacy-configure.txt
          if ($LASTEXITCODE -eq 0) {
            Get-Content legacy-configure.txt
            throw "legacy Strawberry unexpectedly configured successfully"
          }
          Get-Content legacy-configure.txt
          if (-not (Select-String -Path legacy-configure.txt -Pattern "requires OpenSSL 1.1.1 or newer")) {
            throw "expected OpenSSL compatibility diagnostic was not emitted"
          }
          exit 0


  system-gnutls:
    name: Reuse system GnuTLS provider
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set provider pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/ngtcp2-system/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/ngtcp2-system/lib:${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libgnutls28-dev

      - name: Build ngtcp2 1.25.0 with GnuTLS
        run: |
          curl -L --fail --retry 3             https://github.com/ngtcp2/ngtcp2/releases/download/v1.25.0/ngtcp2-1.25.0.tar.gz             -o "${RUNNER_TEMP}/ngtcp2-1.25.0.tar.gz"
          echo "1c0843076528a87b65e9a9d455100941f4cb65d44f96c5da6ae56df146043955  ${RUNNER_TEMP}/ngtcp2-1.25.0.tar.gz"             | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/ngtcp2-1.25.0.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/ngtcp2-1.25.0"
          ./configure             --prefix="${RUNNER_TEMP}/ngtcp2-system"             --enable-lib-only             --with-gnutls=yes             --with-openssl=no             --with-boringssl=no             --with-picotls=no             --with-wolfssl=no             --disable-cryptotest             --enable-shared             --enable-static
          make -j2
          make install
          pkg-config --modversion libngtcp2
          pkg-config --modversion libngtcp2_crypto_gnutls

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          enable-modules-cache: false

      - name: Install Perl dependencies
        run: |
          cpanm --notest Alien::Build::MM
          cpanm --notest --installdeps .

      - name: Configure for system provider
        env:
          ALIEN_INSTALL_TYPE: system
          ALIEN_NGTCP2_CRYPTO: auto
        run: perl Makefile.PL

      - name: Build
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Verify GnuTLS was selected
        run: |
          perl -Iblib/lib -MAlien::ngtcp2 -e '
            die "expected system install\n"
              unless Alien::ngtcp2->install_type eq "system";
            die "expected gnutls backend, got "
              . (Alien::ngtcp2->crypto_backend // "<undef>") . "\n"
              unless Alien::ngtcp2->crypto_backend eq "gnutls";
          '

      - name: Test
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'


  system-openssl-picotls:
    name: Use pre-3.5 system OpenSSL through Picotls
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system OpenSSL development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install non-OpenSSL fallback build dependencies
        run: cpanm --notest Alien::cmake3 URI

      - name: Configure with automatic provider selection
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: |
          perl Makefile.PL 2>&1 | tee configure.log
          if grep -q "prerequisite Alien::OpenSSL .* not found" configure.log; then
            echo "Alien::OpenSSL was incorrectly required despite usable system OpenSSL"
            exit 1
          fi

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Verify Picotls compatibility fallback
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: |
          perl -Iblib/lib -MAlien::ngtcp2 -e '
            die "expected picotls backend, got "
              . (Alien::ngtcp2->crypto_backend // "<undef>") . "\n"
              unless Alien::ngtcp2->crypto_backend eq "picotls";
          '

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'


  native-openssl:
    name: Use OpenSSL 3.5+ native provider
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Build OpenSSL 3.5.7
        run: |
          cd "${RUNNER_TEMP}"
          curl -L --fail --retry 3 \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz \
            -o openssl-3.5.7.tar.gz
          curl -L --fail --retry 3 \
            https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz.sha256 \
            -o openssl-3.5.7.tar.gz.sha256
          sha256sum -c openssl-3.5.7.tar.gz.sha256
          tar -xzf openssl-3.5.7.tar.gz
          cd openssl-3.5.7
          ./Configure \
            --prefix="${RUNNER_TEMP}/openssl-3.5.7-install" \
            --libdir=lib \
            shared
          make -j2
          make install_sw

      - name: Select OpenSSL 3.5.7
        run: |
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/openssl-3.5.7-install/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/openssl-3.5.7-install/lib:${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          echo "OPENSSL_ROOT_DIR=${RUNNER_TEMP}/openssl-3.5.7-install" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/openssl-3.5.7-install/bin" >> "${GITHUB_PATH}"

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          enable-modules-cache: false

      - name: Install Perl build dependencies
        run: |
          cpanm --notest Alien::Build::MM
          cpanm --notest Alien::cmake3 URI

      - name: Verify selected OpenSSL
        run: |
          test "$(pkg-config --modversion openssl)" = "3.5.7"

      - name: Configure with automatic provider selection
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: |
          perl Makefile.PL 2>&1 | tee configure.log
          if grep -q "prerequisite Alien::OpenSSL .* not found" configure.log; then
            echo "Alien::OpenSSL was incorrectly required despite OpenSSL 3.5.7"
            exit 1
          fi

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Verify native OpenSSL backend
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: |
          perl -Iblib/lib -MAlien::ngtcp2 -e '
            die "expected openssl backend, got "
              . (Alien::ngtcp2->crypto_backend // "<undef>") . "\n"
              unless Alien::ngtcp2->crypto_backend eq "openssl";
          '

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: auto
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'


  source-gnutls:
    name: Build source GnuTLS provider
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install native GnuTLS development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libgnutls28-dev pkg-config

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: gnutls
        run: cpanm --notest --installdeps .

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: gnutls
        run: perl Makefile.PL

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: gnutls
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Verify GnuTLS source backend
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: gnutls
        run: |
          perl -Iblib/lib -MAlien::ngtcp2 -e '
            die "expected share install\n"
              unless Alien::ngtcp2->install_type eq "share";
            die "expected gnutls backend, got "
              . (Alien::ngtcp2->crypto_backend // "<undef>") . "\n"
              unless Alien::ngtcp2->crypto_backend eq "gnutls";
          '

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: gnutls
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'


