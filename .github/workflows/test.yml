  minimum-alien-build-windows:
    name: Alien::Build 2.84 on Windows
    runs-on: windows-2025


    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"
