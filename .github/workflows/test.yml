name: test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Perl ${{ matrix.perl }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.22"
          - "5.24"
          - "5.26"
          - "5.28"
          - "5.30"
          - "5.32"
          - "5.34"
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
          - "5.44"

    env:
      ALIEN_INSTALL_TYPE: share

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'

  macos:
    name: macOS Perl ${{ matrix.perl }}
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.28"
          - "5.36"
          - "5.44"

    env:
      ALIEN_INSTALL_TYPE: share

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'

  windows:
    name: Windows Strawberry Perl ${{ matrix.perl }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.28"
          - "5.36"
          - "5.44"

    env:
      ALIEN_INSTALL_TYPE: share

    steps:
      - uses: actions/checkout@v7

      - name: Set up Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: strawberry
          install-modules: Alien::Build::MM
          enable-modules-cache: false

      - name: Install Perl dependencies
        run: cpanm --local-lib=local --notest --installdeps .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'
