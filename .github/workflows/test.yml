      - name: Install Alien::Build 2.84
        run: cpanm --notest https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Build-2.84.tar.gz

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Install fallback build dependencies
        run: cpanm --notest Alien::cmake3 URI

      - name: Install Unix OpenSSL fallback helper
        if: runner.os != 'Windows'
        run: cpanm --notest Alien::OpenSSL

      - name: Verify Alien::Build version
        run: perl -MAlien::Build -e 'die "expected Alien::Build 2.84, got $Alien::Build::VERSION\n" unless $Alien::Build::VERSION eq "2.84"'

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl Makefile.PL

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
