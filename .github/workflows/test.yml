    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Install fallback build dependencies
        run: cpanm --notest Alien::cmake3 URI

      - name: Install Unix OpenSSL fallback helper
        if: runner.os != 'Windows'
        run: cpanm --notest Alien::OpenSSL

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl Makefile.PL

      - name: Build
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}) == 0 or exit 1'

      - name: Test
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
        run: perl -MConfig -e 'system($Config{make}, "test") == 0 or exit 1'

  windows:
    name: Windows Perl ${{ matrix.perl }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.20"
          - "5.28"
          - "5.36"
          - "5.44"


    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false

      - name: Bootstrap Alien::Build
        run: cpanm --notest Alien::Build::MM

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Install fallback build dependencies
        run: cpanm --notest Alien::cmake3 URI

      - name: Install Unix OpenSSL fallback helper
        if: runner.os != 'Windows'
        run: cpanm --notest Alien::OpenSSL

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
