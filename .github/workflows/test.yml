      - name: Verify Alien::Build version
        run: perl -MAlien::Build -e 'die "expected Alien::Build 2.84, got $Alien::Build::VERSION\n" unless $Alien::Build::VERSION eq "2.84"'

      - name: Configure
        env:
          ALIEN_INSTALL_TYPE: share
          ALIEN_NGTCP2_CRYPTO: picotls
